{extend name="__WISE_VIEW__/base" /}

{block name="title"}AI 设置{/block}

{block name="css"}
<link rel="stylesheet" href="/statics/plugins/wise-agent/css/ai_config.css">
{/block}

{block name="content"}
<div class="app-main container-fluid ai-config-page">
    <div class="ai-config-inner">
        <h4 class="mb-3"><i class="bi bi-gear"></i> AI 提供商设置</h4>
        <p class="text-body-secondary mb-4 small">配置 AI 模型提供商。设置完成后可在对话页面选择使用。</p>

        <div id="providers-list"></div>

        <div class="ai-config-card" id="config-form-card" style="display:none;">
            <div class="ai-config-card-header" id="form-title">配置</div>
            <div class="ai-config-card-body">
                <form id="config-form">
                    <input type="hidden" id="form-provider" value="">
                    <div class="mb-3">
                        <label class="form-label">API Key <span class="text-danger">*</span></label>
                        <input type="password" class="form-control ai-config-key" id="form-api-key" placeholder="sk-..." autocomplete="off">
                        <div class="form-text">你的 API Key，将加密存储在数据库中。</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Base URL</label>
                        <input type="text" class="form-control" id="form-api-base" placeholder="https://api.openai.com/v1（留空使用默认）">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">模型名称</label>
                            <input type="text" class="form-control" id="form-model" placeholder="gpt-3.5-turbo">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">最大 Tokens</label>
                            <input type="number" class="form-control" id="form-max-tokens" value="4096" min="1" max="128000">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Temperature</label>
                        <input type="range" class="form-range" id="form-temperature" min="0" max="2" step="0.1" value="0.7">
                        <small class="text-body-secondary">当前值: <span id="temp-val">0.7</span></small>
                    </div>
                    <div class="mb-3 form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="form-is-active" checked>
                        <label class="form-check-label" for="form-is-active">启用此提供商</label>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-outline-secondary" id="btn-test">
                            <i class="bi bi-vial"></i> 测试连接
                        </button>
                        <div>
                            <button type="button" class="btn btn-secondary me-2" id="btn-cancel">取消</button>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> 保存配置</button>
                        </div>
                    </div>
                </form>
                <div id="test-result" class="mt-3" style="display:none;"></div>
            </div>
        </div>

        <div class="ai-config-card mt-4">
            <div class="ai-config-card-header"><i class="bi bi-plug"></i> 插件 AI 能力</div>
            <div class="ai-config-card-body">
                <p class="text-body-secondary small">已安装插件提供的 AI 工具、工作流节点和模型适配器。</p>
                <div id="plugins-ai-summary" class="pt-2">
                    <p class="text-body-secondary">加载中…</p>
                </div>
            </div>
        </div>
    </div>
</div>
{/block}
